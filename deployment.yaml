apiVersion: apps/v1
kind: Deployment
metadata:
  name: Library_Management-deployment
spec:
  replicas: 1  # You can adjust this based on how many instances you want
  selector:
    matchLabels:
      app: Library_Management
  template:
    metadata:
      labels:
        app: Library_Management
    spec:
      containers:
      - name: Library_Management
        image: archit3000/library_management:latest
        ports:
        - containerPort: 3000  # Adjust based on your app's port
---
apiVersion: v1
kind: Service
metadata:
  name: evershop-service
spec:
  selector:
    app: evershop
  ports:
    - protocol: TCP
      port: 80  # Exposing port 80
      targetPort: 3000  # Adjust based on your app's port
  type: NodePort  # This is for Minikube, it will expose it externally
