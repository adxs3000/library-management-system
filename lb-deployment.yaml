apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management-deployment
spec:
  replicas: 1  # You can adjust this based on how many instances you want
  selector:
    matchLabels:
      app: library-management
  template:
    metadata:
      labels:
        app: library-management
    spec:
      containers:
      - name: library-management
        image: archit3000/library-management:latest
        ports:
        - containerPort: 3000  # Adjust based on your app's port
---
apiVersion: v1
kind: Service
metadata:
  name: library-management-service
spec:
  selector:
    app: library-management
  ports:
    - protocol: TCP
      port: 80  # Exposing port 80
      targetPort: 3000  # Adjust based on your app's port
  type: NodePort  # This is for Minikube, it will expose it externally
